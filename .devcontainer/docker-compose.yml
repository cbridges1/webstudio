version: "3.8"

services:
  app:
    init: true
    privileged: true
    build:
      context: .
      dockerfile: Dockerfile

    volumes:
      - ..:/workspaces/webstudio:cached
      # preserve history
      - ./.local:/home/node/.local
      - docker-data:/var/lib/docker
      - ${HOME}/.github/instructions:/home/node/.github/instructions

    entrypoint: ["/usr/local/share/docker-init.sh"]
    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity
    # Runs app on the same network as the database container, allows "forwardPorts" in devcontainer.json function.
    network_mode: service:db

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17.9
    # Uncomment to log all queries
    command: ["postgres", "-c", "log_statement=all", "-c", "listen_addresses=*"]
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: webstudio
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: webstudio

    ports:
      - ${PGPORT:-5432}:5432
      - 3000:3000

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webstudio -d webstudio"]
      interval: 10s
      timeout: 5s
      retries: 25

volumes:
  postgres-data:
  docker-data:
