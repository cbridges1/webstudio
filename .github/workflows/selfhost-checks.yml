# selfhost: the quality gate for the selfhost branch. Upstream's main.yml only runs for main and
# needs the private animation submodule; this one covers selfhost without it. Jobs run in
# parallel, each installing its own dependencies from the pnpm cache.
#
# Suggested required checks (branch protection on selfhost): format, lint, typecheck, test
# (each suite), build.
name: Self-host checks

on:
  pull_request:
    branches: [selfhost]
  push:
    branches: [selfhost]
  workflow_dispatch:

permissions: {}

concurrency:
  group: selfhost-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # Placeholders some modules read at import time; the tests use their own databases.
  DATABASE_URL: postgres://
  AUTH_SECRET: test

jobs:
  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm oxfmt --check

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      - run: pnpm check:package-boundaries

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm -r typecheck

  test:
    name: test (${{ matrix.suite.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: builder-core
            run: pnpm test:builder:core
            browser: false
          - name: builder-app
            run: pnpm test:builder:app
            browser: true
          # The packages the self-hosted builder changes, against an in-process Postgres
          # (PGlite) with the Drizzle migrations applied.
          - name: selfhost-packages
            run: >-
              pnpm -r
              --filter @webstudio-is/db --filter @webstudio-is/trpc-interface
              --filter @webstudio-is/authorization-token --filter @webstudio-is/project-build
              --filter @webstudio-is/project --filter @webstudio-is/domain
              --filter @webstudio-is/dashboard --filter @webstudio-is/asset-uploader
              --filter @webstudio-is/protocol --filter @webstudio-is/deploy
              test
            browser: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Chromium
        if: ${{ matrix.suite.browser }}
        run: pnpm --filter @webstudio-is/builder exec playwright install --with-deps chromium
      - name: Run ${{ matrix.suite.name }}
        env:
          SUITE: ${{ matrix.suite.run }}
        run: bash -c "$SUITE"

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The deploy service runs from source (tsx), so only the builder has a build.
      - name: Build the builder
        run: |
          pnpm --filter "@webstudio-is/builder^..." build
          pnpm --filter @webstudio-is/builder build
