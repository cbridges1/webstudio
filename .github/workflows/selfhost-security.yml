# selfhost: SAST, secrets, dependency, Dockerfile and workflow scans for the selfhost branch
# (upstream's workflows run on main). The repository is public, so CodeQL results go to code
# scanning (Security → Code scanning); the other tools keep their reports as workflow artifacts.
#
# Suggested required checks (branch protection on selfhost): semgrep, gitleaks, deps, codeql.
name: Self-host security

on:
  pull_request:
    branches: [selfhost]
  push:
    branches: [selfhost]
  schedule:
    # Weekly, Monday 06:17 UTC. Also runs the gitleaks scan of every selfhost commit.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: selfhost-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.182.0@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: semgrep scan (fail on ERROR)
        run: |
          semgrep scan --metrics=off \
            --config p/typescript --config p/nodejs --config p/react \
            --config p/expressjs --config p/jwt \
            --text --sarif-output=semgrep.sarif --json-output=semgrep.json
          python3 - <<'PY'
          import json, sys
          results = json.load(open("semgrep.json"))["results"]
          errors = [r for r in results if r["extra"]["severity"] == "ERROR"]
          print(f"semgrep: {len(results)} findings, {len(errors)} at ERROR severity")
          for r in errors:
              print(f"::error file={r['path']},line={r['start']['line']}::{r['check_id']}")
          sys.exit(1 if errors else 0)
          PY
      - name: Upload SARIF
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore
          retention-days: 30

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      EVENT_NAME: ${{ github.event_name }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PUSH_BEFORE_SHA: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks-action needs a license for organization repos, so run the release binary
      # directly (checksum-verified).
      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # PRs and pushes scan their own commits. The weekly run scans every selfhost commit (since
      # the fork point with main); upstream's history is upstream's to clean up.
      - name: gitleaks
        shell: bash
        run: |
          set -euo pipefail
          base=""
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push) base="$PUSH_BEFORE_SHA" ;;
            *) base="$(git merge-base origin/main HEAD 2>/dev/null || true)" ;;
          esac
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "Scanning commits $base..HEAD"
            log_opts=(--log-opts="$base..HEAD")
          else
            echo "Scanning full history"
            log_opts=()
          fi
          gitleaks git . --config .gitleaks.toml --redact --no-banner \
            --exit-code 1 "${log_opts[@]}" \
            --report-format sarif --report-path gitleaks.sarif
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 30

  deps:
    name: deps
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: pnpm audit (production deps, high+)
        shell: bash
        run: |
          set -uo pipefail
          # Human-readable report (a non-zero exit is expected when anything high/critical
          # exists; the gate is below).
          pnpm audit --prod --audit-level=high || true
          set -e
          pnpm audit --prod --json > pnpm-audit.json || true
          # Gate: fail on high/critical advisories that have a fix ("<0.0.0" means none).
          # Advisories with no fix are reported but don't block.
          jq -r '.advisories // {} | to_entries[] | .value
                 | select(.severity == "high" or .severity == "critical")
                 | "\(.severity)\t\(.module_name)\t\(.github_advisory_id // .id)\tfix=\(if .patched_versions == "<0.0.0" then "none" else "available (\(.patched_versions))" end)"' \
            pnpm-audit.json | sort -u | tee pnpm-audit-high.txt
          fixable=$(grep -c 'fix=available' pnpm-audit-high.txt || true)
          if [ "$fixable" -gt 0 ]; then
            echo "::error::$fixable high/critical production advisories have a fix available (see pnpm audit output above)."
            exit 1
          fi
      - name: Upload pnpm audit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pnpm-audit
          path: pnpm-audit.json
          if-no-files-found: ignore
          retention-days: 30

  osv-scanner:
    name: osv-scanner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    # Informational: osv-scanner scans the whole lockfile (dev dependencies and fixtures
    # included) and has no "only fail when a fix exists" mode, so it would duplicate the deps
    # gate with a stricter, noisier one. Not a required check.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: osv-scanner (pnpm-lock.yaml)
        run: |
          docker run --rm -v "$PWD:/src:ro" \
            ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0 \
            scan source --lockfile /src/pnpm-lock.yaml --format table

  trivy-config:
    name: trivy-config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: trivy config (Dockerfile, HIGH+)
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            config --severity HIGH,CRITICAL --exit-code 1 Dockerfile

  # Upstream's workflows are left to upstream; these lint the selfhost ones.
  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        if: ${{ !cancelled() }}
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            .github/workflows/selfhost-*.yml
      - name: zizmor
        if: ${{ !cancelled() }}
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9 \
            --offline --format plain \
            .github/workflows/selfhost-security.yml .github/workflows/selfhost-checks.yml \
            .github/dependabot.yml

  codeql:
    name: codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - fixtures
              - "**/__generated__"
              - "**/*.test.ts"
              - "**/*.test.tsx"
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript
